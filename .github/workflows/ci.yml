name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: |
          node --check renderer/app.js
          node --check renderer/i18n.js
          node --check electron/main.js
          node --check electron/preload.js

      - name: Python syntax check
        run: |
          python3 -m compileall -q backend tools tests
          python3 -m py_compile tools/implement-mac-manager.py tools/verify-migration.py

      - name: Focused cached-plan regression checks
        run: |
          python3 -m unittest discover -s tests -p 'test_unified_updates.py'
          python3 -m unittest discover -s tests -p 'test_update_selection.py'
          python3 -m unittest discover -s tests -p 'test_macports_provider.py'
          python3 -m unittest discover -s tests -p 'test_pixi_provider.py'
          python3 -m unittest discover -s tests -p 'test_migration_engine.py'
          python3 -m unittest discover -s tests -p 'test_migration_profiles.py'
          node tests/stale-plan-ui.cjs
          python3 tools/implement-mac-manager.py unified-check

      - name: Packaging smoke check
        run: npm run pack
